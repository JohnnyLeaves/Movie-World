<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0608" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' https://image.tmdb.org https://cdn.myanimelist.net https://s1.anilist.co https://s2.anilist.co https://s3.anilist.co https://s4.anilist.co data:; connect-src 'self' https://api.themoviedb.org https://graphql.anilist.co https://api.jikan.moe; frame-src https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; form-action 'self'"
    />

    <meta
      name="description"
      content="Discover movies, series and anime. Build collections, save favourites and make every watch count."
    />
    <title>Movie World — Your cinematic universe</title>
    <link rel="icon" href="/assets/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Chakra+Petch:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/experience.css" />
    <link rel="stylesheet" href="/watch.css" />
    <link rel="stylesheet" href="/theme.css" />
    <link rel="stylesheet" href="/mobile.css" />
    <script type="module" src="/js/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div id="app">
      <div class="boot">Entering your cinematic universe…</div>
    </div>
    <div id="toast" role="status" aria-live="polite"></div>
    <dialog id="detail-dialog" aria-label="Title details"></dialog>
    <dialog id="person-dialog" aria-label="Person profile"></dialog>
    <dialog id="trailer-dialog" aria-label="Trailer"></dialog>
    <dialog id="utility-dialog" aria-label="Library settings"></dialog>
  </body>
</html>
